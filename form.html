<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    <title>Форма - ShopOnline</title>
</head>

<body>
    <h1>Добавить товар</h1>

    <form id="my_form" action="https://jsonplaceholder.typicode.com/posts" method="POST">

        <fieldset>
            <p>
                <label>
                    Наименование<br><input type="text" name="name">
                </label>
            </p>

            <p>
                <label>
                    Категория<br><select name="select">
                        <option value="household-appliances">Бытовая техника</option>
                        <option value="furniture">Мебель</option>
                        <option value="clothes">Одежда</option>
                        <option value="other">Другое</option>
                    </select>
                </label>
            </p>

            <p>
                <label>
                    Единицы измерения<br><input type="text" name="measure">
                </label>
            </p>

            <p>
                <label>
                    Дисконт<br><input type="checkbox" name="discount" value="discount">
                </label>
                <input type="text" name="discount_text" disabled>
            </p>

            <p>
                <label>
                    Описание<br><textarea name="description"></textarea>
                </label>
            </p>

            <p>
                <label>
                    Количество<br><input type="number" name="quantity" min="1">
                </label>
            </p>

            <p>
                <label>
                    Цена<br><input type="number" name="price" min="0" step="0.01">
                </label>
            </p>

            <input type="file" name="file" accept="image/*, video/*">
        </fieldset>
    </form>

    <p><button type="submit" form="my_form">Добавить товар</button></p>
</body>

</html>
